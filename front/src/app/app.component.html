<div class="app">
    <mat-toolbar color="primary" fxLayout="row" fxLayoutAlign="space-between center">
        <span>Yoga app</span>
        <div *ngIf="$isLogged() | async; else notLogged">
            <span routerLink="sessions" class="link" data-test="sessions-nav">Sessions</span>
            <span routerLink="me" class="link" data-test="account-nav">Account</span>
            <span (click)="logout()" class="link" data-test="logout-nav">Logout</span>
        </div>
        <ng-template #notLogged>
            <div>
                <span routerLink="login" class="link" data-test="login-nav">Login</span>
                <span routerLink="register" class="link" data-test="register-nav">Register</span>
            </div>
        </ng-template>
    </mat-toolbar>
    <div>
        <router-outlet></router-outlet>
    </div>
</div>

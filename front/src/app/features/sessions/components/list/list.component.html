<div class="list">
    <mat-card>
        <mat-card-header fxLayout="row" fxLayoutAlign="space-between center">
            <mat-card-title class="m0" data-test="page-title">Yoga Sessions
                available</mat-card-title>
            <button *ngIf="user!.admin" mat-raised-button color="primary" routerLink="create"
                    data-test="create-button">
                <mat-icon>add</mat-icon>
                <span class="ml1">Create</span>
            </button>
        </mat-card-header>
        <div class="items mt2" fxLayout="row wrap" fxLayout.lt-md="column" data-test="session-list">
            <mat-card class="item" *ngFor="let session of (sessions$ | async)" fxFlex
                      data-test="session-card">
                <mat-card-header>
                    <mat-card-title data-test="session-name">{{ session.name }}</mat-card-title>
                    <mat-card-subtitle data-test="session-date">
                        Session on {{ session.date | date: 'longDate'}}
                    </mat-card-subtitle>
                </mat-card-header>
                <div mat-card-image fxLayoutAlign="center center">
                    <img class="picture" src="assets/sessions.png" alt="Yoga session"
                         data-test="session-image">
                </div>
                <mat-card-content>
                    <p data-test="session-description">
                        {{ session.description }}
                    </p>
                </mat-card-content>
                <mat-card-actions>
                    <button mat-raised-button color="primary" [routerLink]="['detail',session.id]"
                            data-test="detail-button">
                        <mat-icon>search</mat-icon>
                        <span class="ml1">Detail</span>
                    </button>
                    <button *ngIf="user!.admin" mat-raised-button color="primary"
                            [routerLink]="['update',session.id]" data-test="update-button">
                        <mat-icon>edit</mat-icon>
                        <span class="ml1">Edit</span>
                    </button>
                </mat-card-actions>
            </mat-card>
        </div>
    </mat-card>
</div>

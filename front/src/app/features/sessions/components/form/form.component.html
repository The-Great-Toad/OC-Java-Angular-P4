<div class="create m3">
    <mat-card>
        <mat-card-title>
            <div fxLayout="row" fxLayoutAlign="start center">
                <button mat-icon-button routerLink="/sessions" data-test="back-button">
                    <mat-icon>arrow_back</mat-icon>
                </button>
                <h1 *ngIf="!onUpdate" data-test="create-title">Create session</h1>
                <h1 *ngIf="onUpdate" data-test="update-title">Update session</h1>
            </div>
        </mat-card-title>
        <mat-card-content *ngIf="sessionForm">
            <form class="mt2" fxLayout="column" [formGroup]="sessionForm" (ngSubmit)="submit()">
                <mat-form-field appearance="outline" class="" fxFlex>
                    <mat-label>Name</mat-label>
                    <input matInput formControlName="name" data-test="name-input">
                </mat-form-field>
                <mat-form-field appearance="outline" fxFlex>
                    <mat-label>Date</mat-label>
                    <input matInput type="date" formControlName="date" data-test="date-input">
                </mat-form-field>
                <mat-form-field appearance="outline">
                    <mat-label>Teacher</mat-label>
                    <mat-select ngDefaultControl formControlName="teacher_id"
                                data-test="teacher-select">
                        <mat-option *ngFor="let teacher of teachers$ | async" [value]="teacher.id">
                            {{teacher.firstName}} {{teacher.lastName}}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
                <mat-form-field appearance="outline" fxFlex>
                    <mat-label>Description</mat-label>
                    <textarea matInput rows="8" formControlName="description"
                              data-test="description-textarea"></textarea>
                </mat-form-field>
                <div fxLayout="row" fxLayoutAlign="center center">
                    <button mat-raised-button color="primary" type="submit"
                            [disabled]="sessionForm.invalid" data-test="save-button">
                        Save
                    </button>
                </div>
            </form>
        </mat-card-content>
    </mat-card>
</div>
